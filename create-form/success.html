<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        margin: 0;
      }

      .success-card {
        background: #ffffff;
        max-width: 520px;
        width: 100%;
        padding: 3rem 2.5rem 2.8rem;
        border-radius: 36px;
        box-shadow:
          0 25px 40px -12px rgba(0, 20, 40, 0.25),
          0 8px 18px rgba(0, 0, 0, 0.05),
          inset 0 1px 0 #ffffff;
        text-align: center;
        transition: transform 0.2s ease;
      }

      .check-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #1e4e6b 0%, #2e7ea3 100%);
        border-radius: 50%;
        margin-bottom: 1.5rem;
        box-shadow: 0 12px 24px -8px rgba(23, 68, 97, 0.4);
      }

      .check-icon svg {
        width: 42px;
        height: 42px;
        stroke: white;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        font-size: 2.4rem;
        font-weight: 700;
        color: #10344e;
        letter-spacing: -0.01em;
        margin-bottom: 0.6rem;
        line-height: 1.2;
      }

      .message {
        font-size: 1.1rem;
        color: #476b85;
        margin-bottom: 2rem;
        font-weight: 400;
        line-height: 1.5;
      }

      .back-button {
        display: inline-block;
        text-decoration: none;
        padding: 0.9rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #ffffff;
        background: linear-gradient(135deg, #1e4e6b 0%, #2e7ea3 100%);
        border: none;
        border-radius: 40px;
        cursor: pointer;
        box-shadow:
          0 12px 22px -8px rgba(23, 68, 97, 0.35),
          0 2px 5px rgba(0, 0, 0, 0.05);
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
        -webkit-appearance: none;
        appearance: none;
      }

      .back-button:hover {
        background: linear-gradient(135deg, #1a5a7a 0%, #358bb3 100%);
        box-shadow: 0 18px 28px -10px rgba(23, 68, 97, 0.5);
        transform: translateY(-1px);
      }

      .back-button:active {
        transform: translateY(1px);
        box-shadow: 0 8px 15px -6px rgba(23, 68, 97, 0.5);
      }

      .back-button:focus-visible {
        outline: 3px solid #a3d0e6;
        outline-offset: 3px;
      }

      .greeting {
        font-size: 1rem;
        color: #5882a0;
        margin-top: 1.8rem;
        font-style: italic;
        border-top: 1px solid #d9e2ec;
        padding-top: 1.5rem;
      }

      .greeting span {
        font-weight: 600;
        color: #1e4e6b;
        font-style: normal;
      }

      @media (max-width: 480px) {
        .success-card {
          padding: 2.2rem 1.5rem;
          border-radius: 28px;
        }
        h1 {
          font-size: 2rem;
        }
        .message {
          font-size: 1rem;
        }
        .back-button {
          padding: 0.8rem 1.6rem;
          font-size: 0.95rem;
        }
        .check-icon {
          width: 70px;
          height: 70px;
        }
        .check-icon svg {
          width: 36px;
          height: 36px;
        }
        body {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="success-card">
      <div class="check-icon">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1>Success</h1>
      <p class="message">submitted successfully</p>

      <a href="index.html" class="back-button">back to the forms</a>

      <div class="greeting" id="greeting"></div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");
        const email = params.get("email");
        const greetingDiv = document.getElementById("greeting");
        if (name) {
          const safeName = name.replace(/[&<>"]/g, function (m) {
            if (m === "&") return "&amp;";
            if (m === "<") return "&lt;";
            if (m === ">") return "&gt;";
            if (m === '"') return "&quot;";
            return m;
          });
          greetingDiv.innerHTML = `👋 welcome, <span>${safeName}</span>! check your email plz`;
        } else {
          greetingDiv.innerHTML = `✨ We got you`;
        }
      })();
    </script>
  </body>
</html>
